---
name: '☑️ Install deps'
description: 'Install dependencies and setup node'

runs:
    using: composite
    steps:
        - name: 🖥️ Setup pnpm & Node
          uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
          with:
              runtime: node@20
              install: false

        - name: 🔗 Install Dependencies
          shell: bash
          run: |
              pnpm install --frozen-lockfile --ignore-scripts
